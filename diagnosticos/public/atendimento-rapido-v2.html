<nav class="nav"><div class="wrap"><a class="brand" href="/"><img class="brand-logo" src="/assets/h-talks-logo-light.png" alt="H-TALKS" width="163" height="44"></a></div></nav>
<main class="wrap quick-form-shell"><section class="form-card quick-form-card">
<header class="quick-form-intro"><div class="eyebrow">Diagnóstico gratuito · 1 minuto</div><h1>Descubra onde seu atendimento perde contexto.</h1><p>Responda quatro campos. A HEADS analisa o gargalo e retorna pelo WhatsApp.</p><div class="quick-trust"><span>Revisão humana</span><span>Sem compromisso</span><span>Sem acesso às suas contas</span></div></header>
<form data-offer="atendimento"><div class="grid">
<input type="hidden" name="landing_variant" value="meta_short_v2"><input type="hidden" name="source"><input type="hidden" name="medium"><input type="hidden" name="campaign"><input type="hidden" name="content">
<div class="field hp"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
<div class="field"><label>Seu nome<input name="name" required autocomplete="name"></label></div>
<div class="field"><label>Empresa<input name="company" required autocomplete="organization"></label></div>
<div class="field"><label>WhatsApp profissional<input name="phone" required inputmode="tel" autocomplete="tel"></label></div>
<div class="field"><label>Onde está o principal gargalo?<select name="bottleneck" required><option value="">Selecione</option><option value="context">Cliente precisa repetir o contexto</option><option value="lost">Conversas e oportunidades se perdem</option><option value="queue">Falta fila, responsável ou prazo</option><option value="channels">Canais e históricos estão separados</option><option value="other">Outro</option></select></label></div>
</div><label class="consent"><input type="checkbox" name="consent" required>Autorizo o uso destes dados para analisar e responder esta solicitação, conforme a política de privacidade.</label><button class="btn" type="submit">Quero meu diagnóstico <span aria-hidden="true">→</span></button><p class="quick-submit-note">A resposta será enviada ao WhatsApp informado.</p><div class="status" role="status" aria-live="polite"></div></form>
</section></main>
